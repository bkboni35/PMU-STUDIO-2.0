<!doctype html>
<html lang="fr" style="background-color: #020617; color: #f8fafc; margin: 0; padding: 0; height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PMU-STUDIO 2.0 - Turf & Quinté+</title>
    <meta name="description" content="Application mobile Android et PC d'analyse de courses hippiques PMU, pronostics Quinté+ certifiés et propositions de jeux des IA." />
    
    <!-- Android / Windows PWA & Desktop Web Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PMU-STUDIO" />
    <link rel="icon" type="image/jpeg" href="/horse-logo.jpg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/horse-logo.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <meta property="og:title" content="PMU-STUDIO 2.0 - Turf & Quinté+" />
    <meta property="og:description" content="Application mobile et PC d'analyse de courses hippiques PMU, pronostics Quinté+ certifiés et propositions de jeux des IA." />
    <meta property="og:image" content="/horse-logo.jpg" />
    <meta name="twitter:image" content="/horse-logo.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <!-- Styles prioritaires d'animation et de démarrage immédiat (Anti-Page Blanche) -->
    <style>
      html, body {
        background-color: #020617 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #splash-container {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #0f172a 0%, #020617 75%, #000000 100%);
        z-index: 99999;
        user-select: none;
        padding: 24px;
        box-sizing: border-box;
      }
      .splash-ambient-glow {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.22) 0%, rgba(16, 185, 129, 0.12) 50%, transparent 70%);
        filter: blur(40px);
        animation: pulseAura 3s ease-in-out infinite alternate;
        pointer-events: none;
      }
      .splash-logo-card {
        position: relative;
        width: 110px;
        height: 110px;
        border-radius: 28px;
        padding: 4px;
        background: linear-gradient(135deg, #f59e0b, #10b981, #d97706);
        box-shadow: 0 0 35px rgba(245, 158, 11, 0.35), 0 10px 25px rgba(0, 0, 0, 0.6);
        animation: floatLogo 3.2s ease-in-out infinite;
      }
      .splash-logo-img {
        width: 100%;
        height: 100%;
        border-radius: 24px;
        object-fit: cover;
        display: block;
        background-color: #0f172a;
      }
      .splash-badge-icon {
        position: absolute;
        bottom: -6px;
        right: -6px;
        background: #f59e0b;
        color: #020617;
        font-size: 14px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        border: 2px solid #020617;
        font-weight: 900;
      }
      .splash-title {
        margin-top: 24px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        background: linear-gradient(to right, #ffffff, #fde68a, #f59e0b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-align: center;
      }
      .splash-subtitle {
        margin-top: 6px;
        font-size: 13px;
        font-weight: 600;
        color: #94a3b8;
        letter-spacing: 0.04em;
        text-align: center;
      }
      .splash-progress-track {
        margin-top: 28px;
        width: 220px;
        height: 6px;
        background: rgba(30, 41, 59, 0.8);
        border-radius: 9999px;
        overflow: hidden;
        border: 1px solid rgba(245, 158, 11, 0.25);
        position: relative;
      }
      .splash-progress-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #10b981, #f59e0b, #fbbf24);
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
        animation: progressSlide 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .splash-status-text {
        margin-top: 14px;
        font-size: 12px;
        color: #cbd5e1;
        font-weight: 500;
        text-align: center;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .splash-spinner-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #f59e0b;
        animation: pulseDot 1s infinite alternate;
      }
      .splash-footer-note {
        position: absolute;
        bottom: 24px;
        font-size: 11px;
        color: #64748b;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-weight: 600;
      }
      @keyframes floatLogo {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
      }
      @keyframes pulseAura {
        0% { transform: scale(0.9); opacity: 0.6; }
        100% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes progressSlide {
        0% { left: -45%; width: 45%; }
        50% { width: 65%; }
        100% { left: 100%; width: 30%; }
      }
      @keyframes pulseDot {
        0% { opacity: 0.3; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.2); }
      }
      .splash-fade-out {
        opacity: 0 !important;
        transform: scale(1.02) !important;
        pointer-events: none !important;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1) !important;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-amber-500 selection:text-slate-950 overscroll-none" style="background-color: #020617;">
    <!-- Splash Screen Natif PC & Mobile : Actif dès 0ms sans aucune page blanche -->
    <div id="splash-container">
      <div class="splash-ambient-glow"></div>
      <div class="splash-logo-card">
        <img src="/horse-logo.jpg" alt="PMU-STUDIO 2.0 Logo" class="splash-logo-img" onerror="this.src='/app-icon.jpg'" />
        <div class="splash-badge-icon">⚡</div>
      </div>
      <div class="splash-title">PMU-STUDIO 2.0</div>
      <div class="splash-subtitle">Turf PMU & Quinté+ Algorithmique</div>
      <div class="splash-progress-track">
        <div class="splash-progress-bar" id="splash-progress-bar"></div>
      </div>
      <div class="splash-status-text">
        <span class="splash-spinner-dot"></span>
        <span id="splash-dynamic-msg">Démarrage du logiciel & vérification système...</span>
      </div>
      <div class="splash-footer-note">💻 Édition PC & Web App • Zéro Latence</div>
    </div>

    <!-- Conteneur Racine de l'Application -->
    <div id="root"></div>

    <script>
      (function() {
        var msgs = [
          "Démarrage du logiciel & vérification système...",
          "Initialisation du moteur Turf & Quinté+...",
          "Chargement de la session et des préférences...",
          "Connexion aux flux d'arrivées officielles...",
          "Préparation de l'algorithme d'analyse..."
        ];
        var i = 0;
        var el = document.getElementById('splash-dynamic-msg');
        if (el) {
          var timer = setInterval(function() {
            var splash = document.getElementById('splash-container');
            if (!splash || splash.classList.contains('splash-fade-out') || splash.style.display === 'none') {
              clearInterval(timer);
              return;
            }
            i = (i + 1) % msgs.length;
            if (el) el.textContent = msgs[i];
          }, 600);
        }

        function dismissSplash() {
          var splash = document.getElementById('splash-container');
          if (splash && splash.style.display !== 'none') {
            splash.classList.add('splash-fade-out');
            setTimeout(function() {
              if (splash) splash.style.display = 'none';
            }, 450);
          }
        }

        // Permet de cliquer sur l'écran pour passer le chargement immédiatement
        var splashEl = document.getElementById('splash-container');
        if (splashEl) {
          splashEl.addEventListener('click', dismissSplash);
        }

        // Watchdog anti-blocage absolu : masque le splash après maximum 1.5 seconde
        setTimeout(dismissSplash, 1500);

        // En cas d'erreur de script non gérée, retirer le splash pour ne pas masquer l'interface
        window.addEventListener('error', dismissSplash);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Si on est sur un environnement de développement Cloud Run, purger les anciens caches
          if (window.location.hostname.includes('run.app') || window.location.hostname.includes('localhost')) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (const reg of registrations) {
                reg.update();
              }
            });
          }
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
