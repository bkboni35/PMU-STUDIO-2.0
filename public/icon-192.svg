<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.5"/>
  
  <!-- Subtle inner shadow/glow -->
  <circle cx="96" cy="96" r="70" fill="url(#glow)" opacity="0.12"/>
  
  <!-- Stylized Horse/Turf Trophy Symbol -->
  <g transform="translate(36, 36) scale(0.625)">
    <!-- Horseshoe / Speed Arc -->
    <path d="M 30 140 C 20 90, 40 30, 96 30 C 152 30, 172 90, 162 140 C 158 155, 142 160, 130 148 C 120 138, 126 120, 130 105 C 136 78, 122 56, 96 56 C 70 56, 56 78, 62 105 C 66 120, 72 138, 62 148 C 50 160, 34 155, 30 140 Z" fill="url(#gold)"/>
    <!-- AI Chip / Star Sparkle -->
    <polygon points="96,75 102,89 116,95 102,101 96,115 90,101 76,95 90,89" fill="#ffffff"/>
    <!-- PMU Badge -->
    <circle cx="96" cy="95" r="4" fill="#020617"/>
  </g>
</svg>
